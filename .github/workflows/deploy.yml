name: Deploy Flutter Web
on:
  push:
    branches:
      - dev
jobs:
  build:
    name: 📲 Build and Distribute APK
    runs-on: macos-latest
    steps:
      - name: ⌛️ Checkout Repository
        uses: actions/checkout@v3 # تحديث للإصدار 4 أسرع وأفضل
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: ⚙️ Set up Flutter    
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8' # الإصدار بتاعك بالظبط
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
      - run: flutter config --enable-web
      - run: flutter pub get
      
      # تعديل بسيط في الأمر: حذفنا الـ renderer مؤقتاً للتأكد من الـ build الأساسي
      # وزودنا سطر للتأكد من نظافة الفولدر قبل الـ build
      - run: flutter clean
      - run: flutter build web --release --base-href /nabd_care_dashboard/
      
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: prod