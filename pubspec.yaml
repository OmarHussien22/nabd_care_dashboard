name: care_desk
description: "CareDesk - A Clinic Management System."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  dartz: ^0.10.1
  fl_chart: 0.68.0
  sqflite_common_ffi_web: ^1.0.1+1
  skeletonizer: ^2.1.3
  dotted_border: ^3.1.0
  #syncfusion_flutter_pdfviewer: ^32.2.7
  device_info_plus: ^12.3.0
  universal_html: ^2.3.0
  lottie: ^3.3.1
  go_router: ^14.8.1
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  #----------------- Styling & Loading -----------------
  animations: ^2.0.7
  font_awesome_flutter: ^10.2.1
  flutter_svg: ^2.0.17
  another_xlider: ^3.0.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.0.0+2
  carousel_slider: ^5.0.0
  animated_text_kit: ^4.2.2
  expandable: ^5.0.1
  flutter_spinkit: ^5.1.0
  flutter_staggered_animations: ^1.1.1
  # confetti: ^0.8.0  # Blast some confetti all over the screen and celebrate user achievements!
  #  lottie: ^3.3.0
  flutter_html: ^3.0.0-beta.2
  flutter_widget_from_html: any
  flutter_colorpicker: ^1.1.0
  url_launcher: ^6.1.6
  # qr_flutter: ^4.1.0
  # barcode_scan2: ^4.3.3
  #----------------- Animate Dialgos ----------
  awesome_dialog: ^3.0.2
  flutter_styled_toast: ^2.2.1
  equatable: ^2.0.5
  #----------------- Rating -----------------
  flutter_rating_bar: ^4.0.1
  flutter_rounded_date_picker: ^3.0.2

  #----------------- Scrollable -----------------
  flutter_staggered_grid_view: ^0.7.0
  fluttertoast: ^8.1.1
  #----------------- Fundamental -------------------
  get: ^4.6.6
  path_provider: ^2.0.11
  get_storage: ^2.1.1
  intl: ^0.19.0
  loading_animation_widget: ^1.2.0+3
  image_cropper: ^8.1.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  photo_view: ^0.15.0
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.3.1
  sqflite: ^2.4.1
  path: ^1.9.0
  sqflite_common_ffi: ^2.3.4+4

  pretty_dio_logger: ^1.2.0-beta-1
  dio_http_cache: ^0.3.0
  dio: ^4.0.6
  #shared_preferences: ^2.3.2
  country_code_picker: ^3.1.0
  crypto: ^3.0.3

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: cairo
      fonts:
        # - asset: assets/fonts/Cairo-Thin.otf
        #   weight: 100
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf # regular/normal/plain
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
